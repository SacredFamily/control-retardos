<!DOCTYPE html>
<html>
<head>
    <title>Escáner de Retardos - Sagrada Familia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f0f2f5; }
        #video { width: 100%; max-width: 400px; border-radius: 10px; border: 3px solid #0056b3; background-color: black; }
        #resultado { margin-top: 20px; font-weight: bold; color: #0056b3; font-size: 1.2em; }
    </style>
</head>
<body>
    <h2>I.E. La Sagrada Familia</h2>
    <p>Control de Retardos 2026</p>
    <video id="video"></video><br>
    <div id="resultado">Esperando escaneo...</div>

    <script>
        const codeReader = new ZXing.BrowserQRCodeReader();
        // CORRECCIÓN: La URL debe ir entre comillas
        const RESULT_URL = "https://script.google.com/macros/s/AKfycbwWXOzjsvpHzCUr-Hr0XHwo8juBxmBesm10QXXZwbgSKMfDX25W6cmyClg3QtQHUenq/exec"; 

        // Intentar usar la cámara trasera específicamente
        codeReader.decodeFromVideoDevice(undefined, 'video', (result, err) => {
            if (result) {
                document.getElementById('resultado').innerText = "Enviando: " + result.text;
                
                fetch(RESULT_URL + "?qrData=" + encodeURIComponent(result.text), {
                    method: 'GET',
                    mode: 'no-cors'
                })
                .then(() => {
                    document.getElementById('resultado').style.color = "green";
                    document.getElementById('resultado').innerText = "✅ Registro Exitoso";
                    setTimeout(() => { 
                        document.getElementById('resultado').style.color = "#0056b3";
                        document.getElementById('resultado').innerText = "Listo para siguiente escaneo"; 
                    }, 3000);
                })
                .catch(error => {
                    document.getElementById('resultado').style.color = "red";
                    document.getElementById('resultado').innerText = "❌ Error al enviar";
                    console.error(error);
                });
            }
        });
    </script>
</body>
</html>
